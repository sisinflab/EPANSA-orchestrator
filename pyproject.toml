[project]
name = "epansaorchestrator"
version = "0.1.0"
description = "EPANSA Orchestrator - Multi-tenant knowledge graph system for personal data synchronization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI & Web Framework
    "fastapi",
    "uvicorn[standard]",
    "starlette",
    # Authentication & Security
    "PyJWT",
    "cryptography",
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    # Data & Database
    "pydantic",
    "SQLAlchemy",
    "psycopg2-binary",
    "neo4j>=5.26,<6.0",
    # Utilities
    "python-dotenv",
    "requests",
    "schedule",
    "APScheduler",
    # ML & AI
    "numpy<2.3",
    "ollama",
    "torch",
    "transformers",
    "qwen-vl-utils",
    "Pillow~=10.1.0",
    "opencv-python-headless",
    # LangChain & Knowledge Graph Builder
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "langchain-core",
    "langchain-experimental",
    "langchain-groq",
    "langchain-text-splitters",
    "langchain-huggingface",
    "langchain-neo4j",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-vertexai",
    # Graph & Data Science
    "graphdatascience",
    # Document Processing
    "PyMuPDF",
    "unstructured",
    "unstructured-client",
    "unstructured-inference",
    "chardet",
    "sentence-transformers",
    # OpenAI
    "openai",
    "langgraph>=1.0.1",
    "langchain-google-genai>=2.1.12",
    "graphrag>=2.7.0",
    "google-genai>=1.47.0",
    "google>=3.0.0",
    # Geocoding & Fuzzy Matching
    "geopy>=2.4.1",
    "pycountry-convert",
    "jellyfish",
    "thefuzz>=0.22.1",
    "python-levenshtein>=0.27.3",
    "pycountry>=24.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "libs"]

[dependency-groups]
dev = []
